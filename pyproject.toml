[project]
name = "ll-lrs"
version = "0.1.0"
description = "An adaptive curriculum and learner-state service for a language-learning game"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.139.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13.0"]
build-backend = "uv_build"

[tool.alembic]
script_location = "%(here)s/alembic"
file_template = "%%(epoch)d_%%(slug)s"
# additional paths to be prepended to sys.path. defaults to the current working directory.
prepend_sys_path = [
    "."
]
timezone = "Europe/Berlin"
