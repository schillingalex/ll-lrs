[project]
name = "ll-lrs"
version = "0.1.0"
description = "An adaptive curriculum and learner-state service for a language-learning game"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.139.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13.0"]
build-backend = "uv_build"
